<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Mirroring Live View</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="level-info">
                <h2 id="currentLevelName">Unnamed Level</h2>
                <div class="level-timer" id="currentLevelDuration">0m 0s</div>
                <div class="current-status" id="currentFunction">Idle</div>
            </div>
            <div class="stats-grid">
                <div class="stat-row">
                    <div class="stat-group">
                        <span class="stat-value" id="levelsFinishedCount">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-group">
                        <span class="stat-value" id="averageLevelDuration">N/A</span>
                        <span class="stat-label">Average</span>
                    </div>
                </div>
                <div class="stat-row">
                    <div class="stat-group">
                        <span class="stat-value" id="shortestLevelDuration">N/A</span>
                        <span class="stat-label">Best Time</span>
                    </div>
                    <div class="stat-group">
                        <span class="stat-value" id="previousLevelDuration">N/A</span>
                        <span class="stat-label">Previous</span>
                    </div>
                </div>
            </div>
            <div class="system-status">
                <div id="statusText">Ready</div>
                <div class="longest-levels">
                    <div class="longest-levels-title">Longest Levels</div>
                    <div class="longest-level-item" id="longestLevel1">—</div>
                    <div class="longest-level-item" id="longestLevel2">—</div>
                    <div class="longest-level-item" id="longestLevel3">—</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Live View Section -->
            <div class="live-view-section">
                <div class="preview-container">
                    <canvas id="previewCanvas" width="800" height="600"></canvas>
                    <div class="preview-overlay" id="previewOverlay"></div>
                </div>
                <div class="mouse-coordinates">
                    <div id="coordinates">Mouse: (0, 0)</div>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="controls-section">
                <!-- Game Controls -->
                <div class="control-panel">
                    <h3>🎮 Game Controls</h3>
                    <div class="button-group">
                        <button id="startLiveViewBtn" class="btn btn-success">Start Live View</button>
                        <button id="stopLiveViewBtn" class="btn btn-danger" style="display: none;">Stop Live View</button>
                        <button id="startBtn" class="btn btn-secondary">Start</button>
                        <button id="stopBtn" class="btn btn-danger">Stop</button>
                        <button id="clickAroundTrueBtn" class="btn btn-secondary">Click Around True</button>
                        <button id="clickAroundFalseBtn" class="btn btn-secondary">Click Around False</button>
                    </div>
                </div>

                <!-- Activity Log -->
                <div class="control-panel log-panel">
                    <h3>📋 Activity Log</h3>
                    <div id="activityLog" class="activity-log"></div>
                </div>

                <!-- Detection Controls -->
                <div class="control-panel">
                    <h3>🔍 Detection</h3>
                    <div class="button-group">
                        <button id="detectRedBlobBtn" class="btn btn-primary">Detect Red Blobs</button>
                        <button id="detectBlueBoxBtn" class="btn btn-primary">Detect Blue Boxes</button>
                    </div>
                    <div id="detectionResults" class="detection-summary"></div>
                </div>

                <!-- Settings -->
                <div class="control-panel settings-panel">
                    <h3>⚙️ Settings</h3>
                    <div class="settings-grid">
                        <div class="input-group">
                            <label for="scrollSwipeDistance">Scroll Distance (px):</label>
                            <input type="number" id="scrollSwipeDistance" value="300" min="10">
                        </div>
                        <div class="input-group">
                            <label for="scrollToBottomIterations">Scroll to Bottom Iterations:</label>
                            <input type="number" id="scrollToBottomIterations" value="10" min="1">
                        </div>
                        <div class="input-group">
                            <label for="scrollUpAttempts">Scroll Up Attempts:</label>
                            <input type="number" id="scrollUpAttempts" value="8" min="1">
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="showOverlay"> Show Detection Overlay
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>Overlay Opacity:</label>
                            <input type="range" id="overlayOpacity" min="0.3" max="1" step="0.1" value="0.8">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden elements for backward compatibility -->
    <div style="display: none;">
        <div id="redBlobResults"></div>
        <div id="blueBoxResults"></div>
        <div id="finishBuildStatus"></div>
        <div id="finishBuildStatusList"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
